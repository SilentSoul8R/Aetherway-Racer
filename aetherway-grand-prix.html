<html lang="en"><head><meta charset="utf-8">

<style>

.pl small{display:block;font:700 10px Cinzel,Georgia,serif;letter-spacing:.26em;text-transform:uppercase;color:var(--brass)}
.pl b{font:900 26px 'Cinzel Decorative',Georgia,serif;color:var(--cream)}
.pl i{display:block;font-size:12px;color:var(--teal)}
#ov{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,#150a2488,#0b0516ee)}
.card{max-width:460px;width:100%;text-align:center;padding:24px 22px 24px;background:linear-gradient(#2a1342f2,#150827f2);border:3px double var(--brass);box-shadow:0 0 0 6px #150827,0 0 0 8px var(--brass2),0 24px 60px #000a}

.sub{font-style:italic;color:var(--brass);margin:16px 0 12px;font-size:17px}
.how{font-size:16px;line-height:1.5;color:#e6d9bb;margin:0 0 14px}
.how b{color:var(--brass);font-family:Cinzel,Georgia,serif}.how em{color:var(--cream)}
.keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.keys span{font:700 11px Cinzel,Georgia,serif;letter-spacing:.1em;border:1px solid var(--brass2);padding:4px 8px;text-transform:uppercase}
#bn{position:fixed;z-index:2;top:22%;left:0;right:0;text-align:center;font:900 clamp(22px,6vw,40px) 'Cinzel Decorative',Georgia,serif;text-transform:uppercase;color:var(--cream);text-shadow:3px 3px 0 var(--ox),6px 6px 0 var(--teal);opacity:0;transition:opacity .5s;pointer-events:none}#go{font:700 16px Cinzel,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#1a0b28;background:linear-gradient(var(--brass),var(--brass2));border:2px solid var(--cream);padding:12px 28px;cursor:pointer;box-shadow:4px 4px 0 var(--ox)}
#mid{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}#pb{display:none;width:min(34vw,260px);height:10px;border:2px solid var(--brass);background:#150a26;margin:6px auto}#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--brass))}#shl{color:#6fd0ff;font-size:20px;letter-spacing:4px;margin-top:4px}
#mn{position:fixed;inset:0;z-index:5;display:none;overflow:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 0,#2a1342ee,#0b0518f6);padding:max(12px,env(safe-area-inset-top)) 14px 28px}
#mn .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;max-width:980px;margin:0 auto 8px}#mn .top b{font:900 clamp(18px,4.5vw,28px) 'Cinzel Decorative',Georgia,serif;text-shadow:2px 2px 0 var(--ox)}#mn .top span{font:700 13px Cinzel,Georgia,serif;color:var(--brass);letter-spacing:.1em}
.tabs{display:flex;gap:8px;max-width:980px;margin:0 auto 10px}#mn button{font:700 13px Cinzel,Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:#25103a;border:1px solid var(--brass2);padding:9px 14px;cursor:pointer}#mn button.on,#mn button:hover:not(:disabled){background:linear-gradient(var(--brass),var(--brass2));color:#1a0b28}#mn button:disabled{opacity:.4;cursor:default}
.gm{display:block;width:100%;max-width:980px;margin:0 auto;border:2px solid var(--brass2);background:radial-gradient(ellipse at 50% 50%,#1c0e30,#0a0414)}.info,.it,#mn h4{max-width:980px;margin:10px auto}.info{border:3px double var(--brass);padding:12px 16px;background:#150827cc}.info h3{margin:0 0 4px;font:900 20px 'Cinzel Decorative',Georgia,serif}.info p{margin:4px 0;font-size:16px}.m{color:var(--brass)}.info button{margin:8px 8px 0 0}
.it{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--brass2);padding:8px 12px;background:#150827cc}.it.eq{border-color:var(--teal)}.it b{font:700 15px Cinzel,Georgia,serif;min-width:190px}.it small{flex:1;color:#cdbf9d;font-size:14px}.it em{color:var(--teal)}#mn h4{font:700 14px Cinzel,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
#mbtn{font:700 16px Cinzel,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);background:#25103a;border:2px solid var(--brass);padding:12px 22px;cursor:pointer}
#sr{position:fixed;inset:0;z-index:7;display:none;background:#150a26;touch-action:none}#srcv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#srt{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 22px;background:linear-gradient(#150a26f0 40%,#0000);pointer-events:none}#srt>*{pointer-events:auto}
#srb{display:flex;align-items:baseline;gap:10px;justify-content:center;margin:0 70px}#srb b{font:700 14px Cinzel,Georgia,serif;letter-spacing:.32em;color:var(--brass)}#srcn{font-size:12px;color:#8a7aa8;letter-spacing:.06em}
#srx{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top,0px))}#srch{display:flex;gap:6px;overflow-x:auto;justify-content:center;padding:8px 0 2px;scrollbar-width:none}
#sru{position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#150a26f2 30%);text-align:center}
#srn{font:700 clamp(20px,5vw,30px) Georgia,serif;letter-spacing:.06em;color:var(--brass);text-shadow:2px 2px 0 var(--ox)}#srg{margin-top:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:1px solid;border-radius:2px}.t-steam{color:#e0a45a;border-color:#a8772a}.t-space{color:#8fb8ff;border-color:#3a63b0}.t-future{color:#5ff0ff;border-color:#2a9aa8}.t-dys{color:#ff6f8a;border-color:#a8283c}.t-real{color:#9ee08a;border-color:#4a8a3a}.t-diesel{color:#c8c08a;border-color:#7d7a4a}
#srd{max-width:660px;margin:8px auto 6px;font-size:15px;line-height:1.45;color:#e6d9bb}#srs{font:700 13px Cinzel,Georgia,serif;color:var(--brass);letter-spacing:.06em;margin-bottom:8px}
#srrow{display:flex;align-items:center;gap:6px;max-width:760px;margin:0 auto}#srbt{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
#sr button{font:700 13px Georgia,serif;letter-spacing:.1em;color:var(--cream);background:#25103a;border:1px solid var(--brass2);padding:9px 12px;cursor:pointer;flex:none;min-width:40px;border-radius:2px}#sr button.on{background:linear-gradient(var(--brass),var(--brass2));color:#1a0b28}#sr button.own:not(.on){border-color:var(--teal);color:var(--teal)}#sr button:disabled{opacity:.45;cursor:default}
#srctl{margin-top:8px}#srctl button{margin:0 3px;padding:8px 12px;font-size:12px}
</style></head><body>
<canvas id="c"></canvas><div id="vg"></div><div id="flash"></div>
<div id="hud"><div class="pl"><small>Distance</small><b id="d">0.0</b><i>leagues</i></div><div class="pl"><small>Purse</small><b id="s">0</b><i>sovereigns</i></div></div>
<div id="mid"><div id="pb"><i></i></div><div id="shl"></div></div><div id="bn"></div><div id="mn"></div><div id="ov"><div class="card"><div class="orn">❦ ✦ ❦</div><h1 id="ttl"></h1><div class="sub" id="sub"></div><p class="how" id="how"></p>

<div id="sru"><div id="srn"></div><div id="srg"></div><div id="srd"></div><div id="srs"></div><div id="srrow"><button id="srp">‹</button><div id="srbt"></div><button id="srnx">›</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),rnd=Math.random;
const LW=3.6,S=2.2,LANES=[-LW,0,LW],BG=0x150a26;
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(BG);scene.fog=new THREE.Fog(BG,70,255);
const cam=new THREE.PerspectiveCamera(60,1,.1,1500);
scene.add(new THREE.HemisphereLight(0xb9a6ff,0x2a1236,1));
const sun=new THREE.DirectionalLight(0xffd9a0,1.3);sun.position.set(-6,10,6);scene.add(sun);
const tex=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c)};
const rep=(t,x,y)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(x,y);return t};
const U={value:new THREE.Vector2()},bnd=m=>{m.onBeforeCompile=s=>{s.uniforms.uBend=U;let v=s.vertexShader;const f='float bz=max(0.,-mvPosition.z-6.);mvPosition.xy+=uBend*bz*bz;';v=v.includes('#include <project_vertex>')?v.replace('#include <project_vertex>','vec4 mvPosition=modelViewMatrix*vec4(transformed,1.0);'+f+'gl_Position=projectionMatrix*mvPosition;'):v.replace('vec4 mvPosition = modelViewMatrix * vec4( 0.0, 0.0, 0.0, 1.0 );','vec4 mvPosition = modelViewMatrix * vec4( 0.0, 0.0, 0.0, 1.0 );'+f);s.vertexShader='uniform vec2 uBend;\n'+v};return m},
std=(c,e,f)=>bnd(new THREE.MeshStandardMaterial({color:c,emissive:e,roughness:.5,metalness:.4,flatShading:!!f}));
const brass=std(0xd9a441,0x2a1a04),ox=std(0x8c1c2c,0x1a0308),cream=std(0xf4e8c8,0x201c10),rockM=std(0x4a3a56,0x0a0510,1),
gold=std(0xf2c14e,0x7a5410),goldD=std(0xb8862b,0x3a2508),
bas=c=>bnd(new THREE.MeshBasicMaterial({color:c})),lampM=bas(0xffd890),lampR=bas(0xff4030),lampT=bas(0x40e0c8);

/* ---------- SKY: striped sun, ringed planet, moon, nebulae, stars ---------- */
const glowT=tex(128,128,g=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'#fff');r.addColorStop(1,'#fff0');g.fillStyle=r;g.fillRect(0,0,128,128)});
const NB=[],spr=(c,x,y,z,s,o)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));m.position.set(x,y,z);m.scale.set(s,s,1);scene.add(m);NB.push(m)};
spr(0x8c1c2c,70,50,-380,330,.6);spr(0x2e9c8e,-130,80,-380,300,.35);spr(0x5b2a6b,0,30,-400,460,.55);spr(0xc98f3a,0,10,-390,240,.45);
const sunT=tex(256,256,g=>{const r=g.createLinearGradient(0,0,0,256);r.addColorStop(0,'#f4e8c8');r.addColorStop(.5,'#e0b255');r.addColorStop(1,'#8c1c2c');g.fillStyle=r;g.beginPath();g.arc(128,128,126,0,7);g.fill();g.globalCompositeOperation='destination-out';for(let i=0;i<7;i++)g.fillRect(0,136+i*18,256,2+i*2.2)});
const sunM=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshBasicMaterial({map:sunT,transparent:true,fog:false}));sunM.position.set(0,40,-400);scene.add(sunM);
const planetT=tex(512,256,(g,w,h)=>{const cs=['#8c1c2c','#e8d6a8','#c98f3a','#5b2a6b','#2e9c8e','#e8d6a8','#a8772a'];let y=0;while(y<h){const b=14+rnd()*30;g.fillStyle=cs[rnd()*7|0];g.fillRect(0,y,w,b);y+=b}g.fillStyle='rgba(20,10,36,.2)';for(let y=0;y<h;y+=8)for(let x=(y/8%2)*4;x<w;x+=8){g.beginPath();g.arc(x,y,1.8,0,7);g.fill()}});
const PP=new THREE.Vector3(-95,45,-330),planet=new THREE.Group();planet.position.copy(PP);scene.add(planet);
const pm=new THREE.Mesh(new THREE.SphereGeometry(40,48,32),new THREE.MeshStandardMaterial({map:planetT,roughness:1,fog:false}));planet.add(pm);
const ringG=new THREE.Group();ringG.rotation.x=-Math.PI/2+.38;planet.add(ringG);
[[52,60,0xe8d6a8,.6],[63,66,0xe0b255,.85],[69,78,0x8c1c2c,.5]].forEach(a=>ringG.add(new THREE.Mesh(new THREE.RingGeometry(a[0],a[1],96),new THREE.MeshBasicMaterial({color:a[2],transparent:true,opacity:a[3],side:THREE.DoubleSide,fog:false}))));
const arms=[0,1].map(i=>{const t=new THREE.Mesh(new THREE.TorusGeometry(47+i*4,.5,8,96),new THREE.MeshBasicMaterial({color:0xe0b255,fog:false}));t.rotation.set(.9+i*1.2,i*.6,0);planet.add(t);return t});
const moon=new THREE.Mesh(new THREE.SphereGeometry(9,28,20),new THREE.MeshStandardMaterial({color:0x2e9c8e,emissive:0x0a3a34,roughness:1,fog:false}));moon.position.set(70,30,-240);scene.add(moon);
const NS=1000,sp=new Float32Array(NS*3),sc=new Float32Array(NS*3),sg=new THREE.BufferGeometry();
const seed=i=>{sp[i*3]=(rnd()-.5)*340;sp[i*3+1]=rnd()*130-20;sp[i*3+2]=-420+rnd()*450};
for(let i=0;i<NS;i++){seed(i);const w=rnd()<.5;sc[i*3]=1;sc[i*3+1]=w?.93:.76;sc[i*3+2]=w?.78:.33}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true,fog:false})));

/* ---------- ROAD: brass rails, gas lamps, electric arches ---------- */
const roadT=rep(tex(256,256,(g,w,h)=>{g.fillStyle='#2a1440';g.fillRect(0,0,w,h);g.strokeStyle='rgba(224,178,85,.14)';g.lineWidth=2;
for(let y=0;y<h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
g.fillStyle='#e0b255';g.fillRect(0,0,6,h);g.fillRect(w-6,0,6,h);g.fillStyle='#8c1c2c';g.fillRect(6,0,8,h);g.fillRect(w-14,0,8,h);
g.fillStyle='#f4e8c8';[.355,.645].forEach(f=>{g.fillRect(f*w-3,10,6,90);g.fillRect(f*w-3,138,6,90)});
g.strokeStyle='#e0b255';g.lineWidth=3;[.21,.5,.79].forEach(f=>{const x=f*w,y=h/2;g.beginPath();g.moveTo(x,y-22);g.lineTo(x+12,y);g.lineTo(x,y+22);g.lineTo(x-12,y);g.closePath();g.stroke()})}),1,25);
roadT.anisotropy=8;
const road=new THREE.Mesh(new THREE.PlaneGeometry(12.4,400,1,200),bnd(new THREE.MeshStandardMaterial({map:roadT,roughness:.7,metalness:.1})));road.rotation.x=-Math.PI/2;road.position.z=-170;scene.add(road);
[-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.BoxGeometry(.22,.35,400,1,1,200),brass);r.position.set(s*6.3,.17,-170);scene.add(r)});
const slab=new THREE.Mesh(new THREE.BoxGeometry(12.8,.5,400,1,1,200),std(0x1b0d2a,0));slab.position.set(0,-.3,-170);scene.add(slab);
const haloM=bnd(new THREE.SpriteMaterial({map:glowT,color:0xffc060,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));
const GL={post:new THREE.CylinderGeometry(.07,.12,4,8),base:new THREE.CylinderGeometry(.3,.38,.4,8),globe:new THREE.SphereGeometry(.34,12,8),arch:new THREE.TorusGeometry(6.4,.16,8,48,Math.PI)};
const lamp=s=>{const g=new THREE.Group(),p=new THREE.Mesh(GL.post,brass);p.position.y=2;const b=new THREE.Mesh(GL.base,brass);b.position.y=.2;const o=new THREE.Mesh(GL.globe,lampM);o.position.y=4.2;const h=new THREE.Sprite(haloM);h.scale.set(3.6,3.6,1);h.position.y=4.2;g.add(p,b,o,h);g.position.x=s*6.7;return g};
const archf=()=>{const g=new THREE.Group(),t=new THREE.Mesh(GL.arch,brass);t.scale.y=1.35;g.add(t);for(let i=1;i<10;i++){const a=i/10*Math.PI,b=new THREE.Mesh(GL.globe,lampM);b.scale.setScalar(.45);b.position.set(Math.cos(a)*6.4,Math.sin(a)*8.64,0);g.add(b)}return g};
const LS=26*14,AS=78*5,lamps=[],arches=[];
for(let i=0;i<14;i++)[-1,1].forEach(s=>{const l=lamp(s);l.position.z=10-i*26;scene.add(l);lamps.push(l)});
for(let i=0;i<5;i++){const a=archf();a.position.z=-20-i*78;scene.add(a);arches.push(a)}

/* ---------- THE PLAYER CAR: built by your concept-car engine ---------- */
const CX=(()=>{/* ================= ENGINE =================
   Every attachment point (seats, glass, wheels, lamps, pipes) is computed from the body's own

const PI=Math.PI,TAU=PI*2,V3=(x,y,z)=>new THREE.Vector3(x,y,z),V2=(x,y)=>new THREE.Vector2(x,y),CHK=[],chk=(ok,msg)=>CHK.push({ok:!!ok,msg});
const mk=(geo,mat,p,r,s)=>{const m=new THREE.Mesh(geo,mat);if(p)m.position.set(p[0],p[1],p[2]);if(r)m.rotation.set(r[0],r[1],r[2]);if(s)m.scale.set(s[0],s[1],s[2]);return m},
BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d),CY=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||24),TR=(r,t,a,s)=>new THREE.TorusGeometry(r,t,12,s||56,a||TAU),SP=(r,s)=>new THREE.SphereGeometry(r,s||24,16),

gls=new THREE.MeshPhysicalMaterial({color:0x16323f,metalness:.1,roughness:.04,transparent:true,opacity:.34,clearcoat:1,depthWrite:false}),
chr=met(0xe6ebf2,1,.1),drk=met(0x0d0b12,.7,.4),brs=met(0xd9a441,1,.25),cu=met(0xb87333,1,.3),tyr=met(0x111114,.1,.8),lth=met(0x6a3a22,.1,.7),
steel=met(0x6b7380,.9,.4),gun=met(0x2b303a,.85,.4),rust=met(0x8a4b2a,.5,.75),iron=met(0x3a3633,.8,.55),bone=met(0xd8cfb8,.2,.6),
CY0=0x3ff0ff,MG=0xff3fd0,AMB=0xffa030,RED=0xff2030,ORG=0xff7a20,

$('srsp').style.display=k=='c'?'':'none';fg.visible=k=='c';on=1;$('sr').style.display='block';ci=-1;rs();setTheme('all');show(Math.max(0,items.findIndex(x=>x.idx==eq())))}
function close(){on=0;$('sr').style.display='none';draw()}
function rs(){R2.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;uiH=$('sru').offsetHeight;topH=$('srt').offsetHeight;cam.setViewOffset(innerWidth,innerHeight,0,Math.round((uiH-topH)/2),innerWidth,innerHeight);cam.updateProjectionMatrix()}
function tick(dt){if(!on)return;ck+=dt;idle+=dt;if(auto&&!drag&&idle>1.5)yaw+=dt*.4;stage.rotation.y=yaw;
if(cur){const u=cur.userData;if(u.anim)u.anim.forEach(f=>f(ck,dt));if(u.wheels&&spin)u.wheels.forEach(w=>{w.sp.rotation.x+=w.s*dt*2.2/w.r});if(u.upd)u.upd(dt,spin)}
const asp=innerWidth/innerHeight,free=Math.max(.3,(innerHeight-uiH-topH*.5)/innerHeight),d=bd*zoom*Math.max(Math.max(1,1.12/asp),Math.min(1.7,.72/free));
cam.position.set(0,ty+Math.sin(pit)*d*.6,Math.cos(pit)*d);cam.lookAt(0,ty,0);R2.render(sc,cam)}
return{open,tick,get on(){return on}}})();

/* ---------- MAIN LOOP ---------- */
function update(dt){
if(st=='play'){speed=Math.min(VMAX,speed+dt*.6);dist+=speed*dt;nextRow-=speed*dt;if(nextRow<=0){sec.left-=Math.max(32,speed*.95);if(sec.left<=0){const nt=rnd()<.7?(sec.t=='std'?'traf':'std'):sec.t;if(nt!=sec.t){sec.t=nt;const nm=nt=='std'?'Obstacle Field':'Rush Hour Traffic';setTimeout(()=>{if(st=='play')ban(nm)},285/speed*1000)}sec.left=700+rnd()*500;nextRow=70}else{spawnRow(-285);nextRow=Math.max(32,speed*.95)*(sec.t=='traf'?1.3:1)}}}
else if(st=='menu')speed=14;else speed=Math.max(0,speed-40*dt);
roadT.offset.y+=speed*dt/16;world(dt);
lamps.forEach(l=>{l.position.z+=speed*dt;if(l.position.z>20)l.position.z-=LS});
arches.forEach(a=>{a.position.z+=speed*dt;if(a.position.z>20)a.position.z-=AS});
for(let i=0;i<NS;i++){sp[i*3+2]+=speed*dt*.55;if(sp[i*3+2]>30){seed(i);sp[i*3+2]=-420}}sg.attributes.position.needsUpdate=true;
planet.rotation.y+=dt*.02;SC.p.rotation.z+=dt*2.5;GEAR.rotation.z+=dt*.3;arms[0].rotation.z+=dt*.05;arms[1].rotation.z-=dt*.04;moon.position.x=70+Math.sin(T*.05)*6;
let dx=0;
if(st=='over'){vy-=30*dt;jy+=vy*dt;if(jy<0){jy=0;vy=0}car.position.y=jy;car.rotation.y+=spinV*dt;car.rotation.z+=spinV*.3*dt;spinV*=.975}
else{dx=LANES[lane]-px;px+=dx*Math.min(1,11*VH*dt);
{const g=ground();if(jy>g+.001||vy>0){vy-=36*dt;jy+=vy*dt;if(jy<=g&&vy<=0){jy=g;vy=0}}else{jy=g;vy=0}}
car.position.set(px,jy+(jy==0?Math.sin(T*45)*.008:0),0);car.rotation.set(vy*.012,-dx*.09,dx*.025)}
if(CU){if(CU.anim)CU.anim.forEach(f=>f(T,dt));if(CU.wheels)CU.wheels.forEach(w=>{w.sp.rotation.x+=w.s*speed*dt/w.r});if(CU.upd)CU.upd(dt,true)}
for(let i=obs.length-1;i>=0;i--){const o=obs[i],m=o.m,p=m.position;p.z+=(speed-(o.tv||0))*dt;
if(o.t=='coin')m.rotation.y+=dt*4;else if(m.userData.spin)m.userData.spin.rotation.y+=dt*1.3;
if(p.z>(o.t=='plat'?40:14)){scene.remove(m);obs.splice(i,1);continue}
if(st!='play'||o.t=='plat'||Math.abs(p.z)>4)continue;
if(o.t=='coin'){if(Math.abs(p.z)<1.7&&Math.abs(p.x-px)<1.6&&Math.abs(p.y-(jy+.6))<1.5){coins+=VM;scene.remove(m);obs.splice(i,1)}}
else{const h=HB[o.t];if(Math.abs(p.z)<h[1]+1.5&&Math.abs(p.x-px)<h[0]+.55&&jy<h[2]){if(shields>0){shields--;bump();scene.remove(m);obs.splice(i,1)}else{crash();break}}}}
shakeT-=dt;const sh=shakeT>0?(rnd()-.5)*shakeT*1.4:Math.sin(T*70)*speed*.0004,asp=innerWidth/innerHeight,sl=Math.min(1.4,speed/80);
cam.fov=(asp<1?74:58)+sl*14+warp*14;cam.updateProjectionMatrix();
cam.position.set(px*.5+sh+(st=='menu'?Math.sin(T*.4)*2:0),(asp<1?7.2:5.6)+sh+jy*.5,(asp<1?12.5:9.6)+sl*1.5);cam.lookAt(px*.3,1.2+jy*.4,-14);cam.rotateZ(-U.value.x*50);
$('d').textContent=(dist/90).toFixed(1);$('s').textContent=coins;if(mode=='lane'&&st=='play'){const pr=Math.min(1,(lstart+dist/90)/LN.len);$('pb').firstChild.style.width=pr*100+'%';if(pr>=1)arrive()}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);if(!SR.on)R.render(scene,cam);SR.tick(dt)}
openMenu();requestAnimationFrame(loop);
</script></body></html>
